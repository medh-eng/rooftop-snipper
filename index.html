<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101518">
  <meta name="description" content="Play nine cinematic rooftop and drone contracts across three fictional cities in Rooftop Sniper: Red Signal.">
  <title>Rooftop Sniper · Red Signal</title>
  <link rel="icon" href="assets/ui/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script defer src="src/campaign.js"></script>
  <script defer src="src/interface.js"></script>
  <script defer src="src/engine.js"></script>
  <script defer src="src/app.js"></script>
</head>
<body>
  <header class="topbar" id="topbar">
    <div class="bar-inner">
      <button class="brand" data-action="operations" aria-label="Rooftop Sniper operations"><img width="39" height="39" src="assets/ui/mark.svg" alt=""><span>ROOFTOP <b>SNIPER</b></span></button>
      <nav class="primary-nav" aria-label="Main navigation">
        <button data-action="operations" data-tab="operations"><i data-icon="grid"></i><span>Operations</span></button>
        <button data-action="armory" data-tab="armory"><i data-icon="case"></i><span>Armory</span></button>
        <button data-action="career" data-tab="career"><i data-icon="medal"></i><span>Career</span></button>
      </nav>
      <div class="bar-tools"><span class="wallet" title="Available credits"><i data-icon="coin"></i><strong id="balance">350</strong><small>CR</small></span><button id="audio" class="utility" data-action="audio" aria-label="Mute sound"></button></div>
    </div>
  </header>
  <main id="main" tabindex="-1"></main>
  <footer class="site-footer" id="footer"><span><i class="status-dot"></i> LOCAL SAVE</span><span>ROOFTOP SNIPER <b>/</b> RED SIGNAL</span></footer>
  <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-inner"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>Enable JavaScript to play Rooftop Sniper.</noscript>
</body>
</html>
