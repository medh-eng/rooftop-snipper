name: Rebuild Harbor Watch walker
on:
  push:
    branches:
      - chatgpt/harbor-crowd-phase2
    paths:
      - tools/harbor-watch/author_walker.py
      - .github/workflows/rebuild-harbor-walker.yml

permissions:
  contents: write

jobs:
  blender-walk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Blender and its NumPy exporter dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
      - name: Verify Blender can export FBX
        run: |
          blender --background --python-exit-code 1 --python-expr "import numpy, sys; print('Blender Python', sys.version, 'NumPy', numpy.__version__)"
      - name: Regenerate original redistributable FBX
        shell: bash
        run: |
          set -euo pipefail
          output="unity/HarborWatch/Assets/HarborWatch/Resources/HarborWalker.fbx"
          rm -f "$output"
          blender --background --python-exit-code 1 --python tools/harbor-watch/author_walker.py
          test -s "$output"
      - name: Check changed FBX into the feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add unity/HarborWatch/Assets/HarborWatch/Resources/HarborWalker.fbx
          if git diff --cached --quiet; then
            echo 'FBX is unchanged'
          else
            git commit -m "Bake smoother three-step curved turns into HarborWalker FBX"
            git push origin HEAD:chatgpt/harbor-crowd-phase2
          fi
      - name: Upload FBX build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HarborWalker-three-step-curves
          path: unity/HarborWatch/Assets/HarborWatch/Resources/HarborWalker.fbx
          if-no-files-found: ignore
