name: Rebuild Harbor Watch commuter gaits
on:
  push:
    branches:
      - chatgpt/harbor-crowd-phase2
    paths:
      - tools/harbor-watch/author_walker.py
      - tools/harbor-watch/author_commuter_gaits.py
      - .github/workflows/rebuild-harbor-walker.yml

permissions:
  contents: write

jobs:
  blender-walk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Blender and NumPy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
      - name: Build original walk and two in-place crowd cycles
        shell: bash
        run: |
          set -euo pipefail
          blender --background --python-exit-code 1 --python tools/harbor-watch/author_commuter_gaits.py
          for name in HarborWalker CrowdWalk CrowdJog; do
            test -s "unity/HarborWatch/Assets/HarborWatch/Resources/${name}.fbx"
          done
      - name: Commit generated FBX files back to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add unity/HarborWatch/Assets/HarborWatch/Resources/{HarborWalker,CrowdWalk,CrowdJog}.fbx
          if git diff --cached --quiet; then
            echo 'All exported FBX files are unchanged'
          else
            git commit -m "Bake walking and jogging pedestrian cycle assets"
            git push origin HEAD:chatgpt/harbor-crowd-phase2
          fi
